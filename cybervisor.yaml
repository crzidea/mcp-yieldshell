# For guidance on editing this file, run: `cybervisor docs cybervisor.yaml`
hooks:
  before_stage: ~/.cybervisor/hooks/send-stage-notification.sh
  after_stage: ~/.cybervisor/hooks/send-stage-notification.sh

stages:
  - name: Plan
    prompt_template: |
      Act as the product lead, technical lead, and delivery lead for this repository.

      ## Objective

      Produce the planning documents for this request:

      {objective}

      ## Artifacts

      Write all four canonical artifacts for downstream stages:
      - .cybervisor/artifacts/spec.md
      - .cybervisor/artifacts/plan.md
      - .cybervisor/artifacts/tasks.md
      - .cybervisor/artifacts/verify.md

      ## Document Responsibilities

      - Treat `.cybervisor/artifacts/spec.md` as the canonical product specification.
      - Treat `.cybervisor/artifacts/plan.md` as the canonical implementation plan.
      - Treat `.cybervisor/artifacts/tasks.md` as the canonical execution checklist.
      - Treat `.cybervisor/artifacts/verify.md` as the canonical manual verification guide.
      - Clearly describe what is being built, who it serves, why it matters, and how success is judged.
      - Define the user problem, expected workflow, acceptance criteria, and notable product or UX risks in the specification.
      - Define the architecture, major technical decisions, sequencing, validation strategy, integration points, and notable delivery risks in the plan.
      - Produce a clear, ordered checklist-style task breakdown that covers implementation, testing, and verification work.
      - If the project is not fully initialized yet, include the required stack, scaffolding, dependencies, configuration, and first-run setup guidance in the plan and tasks.
      - Make the tasks specific enough to be completed and checked off independently during implementation.

      ## Verification Guide

      - In `.cybervisor/artifacts/verify.md`, write a step-by-step manual verification guide that a human reviewer can follow to confirm the implementation works as intended; include prerequisites, setup steps, each verification scenario with expected results, and how to clean up or roll back after testing; focus on user-visible behavior and acceptance criteria from the specification, not on code-level checks.

      ## Quality

      - Keep the four artifacts consistent with one another.
      - Keep all four artifacts concise and compact, especially `.cybervisor/artifacts/plan.md`, `.cybervisor/artifacts/tasks.md`, and `.cybervisor/artifacts/verify.md`.
      - Do not include specific code implementations, snippets, or blocks; focus on requirements, architecture, and actionable work planning to save tokens.
      - Proactively use web search when unsure about existing solutions, library capabilities, API patterns, or best practices; research before committing to a design decision rather than guessing.
      - Evaluate whether the proposed product scope, technical design, and task ordering represent the most practical path to a successful implementation.
    cleanup:
      - .cybervisor/artifacts
      - .cybervisor/backups
      - .cybervisor/logs/stages
      - .tmp
    read_only_paths:
      - "src/**"
      - "tests/**"
      - "pyproject.toml"
      - "uv.lock"
      - "AGENTS.md"
    max_retries: 5
    contract:
      required_tasks:
        - Write the .cybervisor/artifacts/spec.md product specification
        - Write the .cybervisor/artifacts/plan.md implementation plan
        - Write the .cybervisor/artifacts/tasks.md execution checklist
        - Write the .cybervisor/artifacts/verify.md manual verification guide
      routes:
        PLAN_READY:
          description: The required planning artifacts were written and are ready for review.
          next_stage: Review Plan

  - name: Review Plan
    prompt_template: |
      Perform a senior cross-functional review of the current planning documents.

      ## Objective

      Review planning documents for:

      {objective}

      ## Context

      - Use `.cybervisor/artifacts/spec.md`, `.cybervisor/artifacts/plan.md`, `.cybervisor/artifacts/tasks.md`, and `.cybervisor/artifacts/verify.md` as the canonical planning context.
      - If any artifact is missing or the document set does not contain a relevant specification, implementation plan, execution-ready task breakdown, and manual verification guide for the objective, use `NO_RELEVANT_ARTIFACTS` status.

      ## Review Scope

      - Review the four artifacts together for product clarity, technical soundness, execution order, testing coverage, verification coverage, and consistency.
      - Inspect scope, assumptions, acceptance criteria, architecture, sequencing, dependencies, risks, and implementation safety.
      - Actively challenge the proposed product scope, architecture, sequencing, dependencies, and validation strategy instead of only checking whether the current documents are internally consistent.

      ## Challenge Review

      - Write `.cybervisor/artifacts/challenge-log.md` before finishing this stage.
      - Structure the challenge log for multiple review iterations; preserve prior review entries and append or update clearly instead of replacing the file wholesale.
      - Review prior decisions in `.cybervisor/artifacts/challenge-log.md` on every run; reaffirm decisions that still hold and supersede decisions that no longer represent the best path.
      - Keep the challenge log organized with these sections:
        - `# Challenge Log`
        - `## Current Decision`: the currently approved solution or delivery strategy, with status `accepted`, `replaced`, or `blocked`
        - `## Decision History`: one concise entry per review iteration, newest last, including the review iteration number, artifacts reviewed, prior decisions reviewed, alternatives considered, decision, and whether canonical artifacts changed
        - `## Alternatives Considered`: stable records for each materially different solution or delivery strategy, including summary, benefits, risks, verification impact, and final disposition
        - `## Challenge Decisions`: one record for each challenged assumption or solution weakness, including the decision made, whether it reaffirmed or superseded a prior decision, and whether it changed the canonical artifacts
      - In each review iteration, record the current documented solution, at least two materially different alternative solutions or delivery strategies considered, the tradeoffs for each, and the final decision.
      - Every challenge must have a decision before the stage finishes; do not leave unresolved challenge items for later turns.
      - Challenge assumptions that make the current solution more complex, fragile, expensive, hard to verify, or misaligned with the objective.
      - Prefer simpler, safer, more verifiable solutions when they satisfy the same objective and acceptance criteria.
      - If a new solution or delivery strategy is better than the current documented one, update `.cybervisor/artifacts/spec.md`, `.cybervisor/artifacts/plan.md`, `.cybervisor/artifacts/tasks.md`, and `.cybervisor/artifacts/verify.md` to replace the current approach before finishing this stage.
      - If the existing solution remains best, keep the canonical artifacts stable and explain why in `.cybervisor/artifacts/challenge-log.md`.
      - If the canonical artifacts are missing or irrelevant, use `.cybervisor/artifacts/challenge-log.md` to record that the challenge review could not be completed against a relevant document set.

      ## Refinements

      - If refinements are needed, edit `.cybervisor/artifacts/spec.md`, `.cybervisor/artifacts/plan.md`, `.cybervisor/artifacts/tasks.md`, and `.cybervisor/artifacts/verify.md` directly before finishing this stage.
      - Do not rewrite correct sections unnecessarily; preserve stable content and make the smallest edits needed.
      - Keep refinements focused on clarity, consistency, sequencing, validation coverage, dependency handling, and readiness for autonomous implementation.
      - Allowed edits in this stage are limited to product clarity fixes, architecture and sequencing corrections, task breakdown improvements, missing validation work, and objective alignment.
      - Do not include specific code implementations, snippets, or blocks in the artifacts; focus on requirements, architecture, and actionable planning to save tokens.
      - Keep the review output actionable and specific.
      - Use `CHANGES_MADE` when the challenge review creates or materially updates `.cybervisor/artifacts/challenge-log.md`, or when it changes any canonical planning artifact.
    contract:
      fields:
        Required Changes:
          description: Concrete document updates required before implementation can begin safely.
          example: |
            - Add acceptance criteria for failure handling and recovery.
            - Add ordered tasks for the required migration and regression coverage.
        Objective Mismatch:
          description: Why the current document set does not match the requested objective.
          example: |
            The current documents focus on reporting improvements instead of the requested approval workflow.
      required_tasks:
        - Write or update the .cybervisor/artifacts/challenge-log.md challenge log
      routes:
        IMPLEMENTATION_READY:
          description: The specification, plan, and tasks are aligned and ready for implementation.
          next_stage: Implement
        CHANGES_MADE:
          description: This review run updated one or more planning artifacts, so the revised documents must be reviewed again before implementation.
          next_stage: Review Plan
        NO_RELEVANT_ARTIFACTS:
          description: The current artifacts are missing or do not meaningfully address the requested objective.
          next_stage: Plan
          injections: [Objective Mismatch, Required Changes]
    backup_artifacts:
      - .cybervisor/artifacts/spec.md
      - .cybervisor/artifacts/plan.md
      - .cybervisor/artifacts/tasks.md
      - .cybervisor/artifacts/verify.md
      - .cybervisor/artifacts/challenge-log.md
    read_only_paths:
      - "src/**"
      - "tests/**"
      - "pyproject.toml"
      - "uv.lock"
      - "AGENTS.md"
    max_retries: 5
    max_iterations: 3
    max_iterations_next_stage: Implement
    reset_iterations:
      - Review Code
      - Review Docs

  - name: Implement
    prompt_template: |
      Implement the approved feature end to end using `.cybervisor/artifacts/spec.md`, `.cybervisor/artifacts/plan.md`, and `.cybervisor/artifacts/tasks.md`.

      ## Context

      - Use `.cybervisor/artifacts/spec.md`, `.cybervisor/artifacts/plan.md`, `.cybervisor/artifacts/tasks.md`, and `.cybervisor/artifacts/verify.md` as canonical delivery documents.
      - Treat `.cybervisor/artifacts/tasks.md` as the active checklist; mark items complete only after they are fully finished.

      ## Requirements

      - Make production-ready code changes.
      - Work through the todo items in `.cybervisor/artifacts/tasks.md` in order.
      - Mark each todo item complete in `.cybervisor/artifacts/tasks.md` immediately after that item is actually finished.
      - Do not mark a todo item complete before the corresponding implementation, testing, or verification work is done.
      - Add or update automated tests.
      - Preserve existing project conventions.
      - Prepare the codebase for senior review without asking the user follow-up questions.
    keep_artifacts:
      - .cybervisor/artifacts/spec.md
      - .cybervisor/artifacts/plan.md
      - .cybervisor/artifacts/tasks.md
      - .cybervisor/artifacts/verify.md
      - .cybervisor/artifacts/challenge-log.md
    max_retries: 5
    contract:
      required_tasks:
        - Implement all tasks listed in .cybervisor/artifacts/tasks.md
        - Add or update automated tests for all implemented work
        - Mark all completed tasks as done in .cybervisor/artifacts/tasks.md
      routes:
        IMPLEMENTATION_COMPLETE:
          description: The implementation and automated tests are ready for code review.
          next_stage: Review Code

  - name: Review Code
    prompt_template: |
      Perform a senior engineering review of the latest implementation and refine it directly when needed.

      ## Context

      - Use `.cybervisor/artifacts/spec.md`, `.cybervisor/artifacts/plan.md`, `.cybervisor/artifacts/tasks.md`, and `.cybervisor/artifacts/verify.md` to confirm what the implementation is supposed to deliver.
      - If any of `.cybervisor/artifacts/spec.md`, `.cybervisor/artifacts/plan.md`, `.cybervisor/artifacts/tasks.md`, or `.cybervisor/artifacts/verify.md` is missing, use `IMPLEMENTATION_INCOMPLETE` status.

      ## Review Scope

      - Check the implementation against all generated docs so far and judge whether the code, tests, and behavior remain consistent with the spec, plan, and task breakdown.
      - Inspect correctness, regressions, edge cases, and test quality.
      - Call out any inconsistencies between the implementation and the generated docs, including scope drift, missing planned work, or behavior that no longer matches the documented workflow.

      ## Fixes

      - If targeted fixes are needed, edit the code and tests directly before finishing this stage.
      - Make the smallest correct set of changes and preserve working behavior outside the reported issues.
      - Keep any fixes aligned with the approved scope and existing project conventions.
      - Do not rewrite correct code unnecessarily.
      - Do not include large blocks of code in the review findings; use concise references to files, line numbers, and logic to save tokens.
      - Keep the review actionable and specific.
      - If this stage edited any implementation or test file during the current run, do not use `APPROVED` status.
      - Use `APPROVED` status only when the implementation is ready for documentation review and this stage made no code or test edits during the current run.
    contract:
      fields:
        Findings:
          description: Specific correctness, regression, or completeness issues found in the implementation.
          example: |
            - The drain task does not handle pipe EOF correctly on Linux.
            - The timeout handler leaks the asyncio task reference if the process exits before timeout.
        Required Changes:
          description: Concrete fixes required before the implementation can be approved.
          example: |
            - Handle EOF in drain tasks by catching BrokenPipeError and closing the buffer.
            - Cancel the timeout task in the completion tracker to prevent resource leaks.
      routes:
        APPROVED:
          description: The implementation passed code review and is ready for documentation review.
          next_stage: Review Docs
        IMPLEMENTATION_INCOMPLETE:
          description: The implementation is still materially unfinished and must return to implementation.
          next_stage: Implement
          injections: [Findings, Required Changes]
        CHANGES_MADE:
          description: This review run updated the implementation or tests, so the revised code must be reviewed again before documentation review.
          next_stage: Review Code
    keep_artifacts:
      - .cybervisor/artifacts/spec.md
      - .cybervisor/artifacts/plan.md
      - .cybervisor/artifacts/tasks.md
      - .cybervisor/artifacts/verify.md
      - .cybervisor/artifacts/challenge-log.md
    max_retries: 5
    max_iterations: 5
    max_iterations_next_stage: Review Docs

  - name: Review Docs
    prompt_template: |
      Perform a senior documentation review of the implemented feature and its tracked docs.

      ## Context

      - Use `.cybervisor/artifacts/spec.md`, `.cybervisor/artifacts/plan.md`, `.cybervisor/artifacts/tasks.md`, and `.cybervisor/artifacts/verify.md` to confirm the intended feature behavior, usage flow, and technical scope.

      ## Review Scope

      - Inspect the implementation together with `README.md`, `AGENTS.md`, and the relevant files under `docs/`.
      - `README.md` is the primary user-facing documentation covering installation, MCP client configuration, tool reference, configuration variables, and security notes.
      - `AGENTS.md` is the developer-facing documentation covering architecture, build/test commands, coding style, and testing guidelines.
      - `docs/` is for durable usage guidance, workflow explanations, and operational docs that exceed what fits in the README.
      - Confirm that user-facing behavior, usage instructions, setup steps, constraints, and the surface-level way the feature works are documented clearly enough for future users and contributors.
      - Confirm that developer-facing docs reflect the current architecture, conventions, and development workflow.

      ## Refinements

      - Focus on tracked documentation only; durable guidance must live in `docs/` and, when relevant, `README.md`, and repository-level agent conventions must live in `AGENTS.md`.
      - If documentation refinements are needed, edit `README.md`, `AGENTS.md`, or the relevant files under `docs/` directly before finishing this stage.
      - Do not rewrite sound documentation unnecessarily; preserve stable content and make the smallest edits needed.
      - Keep refinements focused on usage, setup, constraints, examples, troubleshooting, and concise surface-level behavior explanations.
      - Do not dive deeply into implementation internals, architecture details, or low-level technical design unless a user needs that detail to use or operate the feature correctly.
      - Do not require documentation for unrelated areas of the repository.
      - Keep the review actionable and specific.
      - If this stage edited any tracked documentation file during the current run, do not use `APPROVED` status.
      - Use `APPROVED` status only when the relevant docs are complete and aligned with the implementation and this stage made no documentation edits during the current run.
    contract:
      fields:
        Findings:
          description: Specific documentation gaps or mismatches discovered during review.
          example: |
            - `README.md` explains setup but does not mention the new configuration variable.
            - `AGENTS.md` omits the new module from the project structure section.
        Required Changes:
          description: Concrete documentation updates required before verification can begin.
          example: |
            - Add the new env var to the Configuration Variables table in README.md.
            - Update the module organization list in AGENTS.md.
      routes:
        APPROVED:
          description: The relevant tracked docs are aligned with the implementation and ready for verification.
          next_stage: Verify
        CHANGES_MADE:
          description: This review run updated tracked documentation, so the revised docs must be reviewed again before verification.
          next_stage: Review Docs
    keep_artifacts:
      - .cybervisor/artifacts/spec.md
      - .cybervisor/artifacts/plan.md
      - .cybervisor/artifacts/tasks.md
      - .cybervisor/artifacts/verify.md
      - .cybervisor/artifacts/challenge-log.md
    read_only_paths:
      - "src/**"
      - "tests/**"
    max_retries: 5
    max_iterations: 2
    max_iterations_next_stage: Verify

  - name: Verify
    prompt_template: |
      Verify the latest reviewed implementation from a user and operator perspective.

      ## Context

      - Use `.cybervisor/artifacts/spec.md`, `.cybervisor/artifacts/plan.md`, `.cybervisor/artifacts/tasks.md`, and `.cybervisor/artifacts/verify.md` to confirm the intended workflow and acceptance expectations.
      - Run the test suite, linting, type-checking, and server startup checks for this repository.

      ## Responsibilities

      - Run the full test suite with `uv run pytest` and inspect results.
      - Run linting with `uv run ruff check .` and type-checking with `uv run pyright`.
      - Verify the MCP server can start without errors using `uv run mcp-yieldshell`.
      - Check for user-facing regressions and missing acceptance criteria.
      - Do not silently patch implementation issues.
    cleanup:
      - .cybervisor/artifacts/verification-report.md
    contract:
      required_tasks:
        - Run uv run pytest and ensure all tests pass
        - Run uv run ruff check . and ensure no lint errors
        - Run uv run pyright and ensure no type errors
        - Verify MCP server starts cleanly with uv run mcp-yieldshell
        - Write a fresh .cybervisor/artifacts/verification-report.md report with executed scenarios and evidence
      fields:
        Verification Results:
          description: Verification evidence and observed outcomes.
          example: |
            - All 42 tests pass.
            - Ruff reports no lint errors.
            - Pyright reports no type errors.
            - Server starts and responds to MCP tool calls correctly.
        Required Changes:
          description: Concrete fixes required before verification can pass.
          example: |
            - Fix the failing test in test_integration.py.
            - Resolve the pyright type error in process/manager.py.
      routes:
        APPROVED:
          description: Verification passed and no further implementation work is required.
          next_stage: Commit
        CHANGES_REQUESTED:
          description: Verification found issues that must be fixed before the work can be accepted.
          next_stage: Review Code
          injections: [Verification Results, Required Changes]
    keep_artifacts:
      - .cybervisor/artifacts/spec.md
      - .cybervisor/artifacts/plan.md
      - .cybervisor/artifacts/tasks.md
      - .cybervisor/artifacts/verify.md
      - .cybervisor/artifacts/challenge-log.md
      - .cybervisor/artifacts/verification-report.md
    max_retries: 5
    max_iterations: 2
    reset_iterations:
      - Review Code
      - Review Docs

  - name: Commit
    prompt_template: |
      Commit the delivery that passed verification.

      ## Repository Scope

      - Inspect status and diffs in the outer repository.
      - Inspect status and diffs in every independent nested repository.
      - Identify only files belonging to the verified delivery.
      - Use the planning artifacts and verification report as scope evidence.
      - Preserve and leave unstaged every unrelated pre-existing or user-owned change.

      ## Commit Requirements

      - Create one focused Conventional Commit in each affected nested repository.
      - Create the outer-repository commit after all affected nested repositories.
      - Never stage secrets, `.env*`, keys, logs, `.cybervisor/` runtime state, or generated files.
      - Never stage or commit any files under `.cybervisor/` directory under any circumstances.
      - Never stage unrelated changes.
      - Do not amend, rebase, force-push, push, or open a pull request.
      - Verify every created commit.

      ## Retry Safety

      - Inspect recent commits before staging any file.
      - Detect repositories whose verified changes were committed by an earlier attempt.
      - Reuse an existing matching commit instead of creating a duplicate or empty commit.
      - If an earlier attempt committed only part of the delivery, commit only the remaining repositories.
      - Confirm every created commit contains the intended verified diff.
    keep_artifacts:
      - .cybervisor/artifacts/continuous/selection.md
      - .cybervisor/artifacts/continuous/spec.md
      - .cybervisor/artifacts/plan.md
      - .cybervisor/artifacts/tasks.md
      - .cybervisor/artifacts/verify.md
      - .cybervisor/artifacts/verification-report.md
    max_retries: 2
    contract:
      required_tasks:
        - Inspect status and diffs in the outer and all nested repositories
        - Stage only files belonging to the verified delivery
        - Create focused Conventional Commits in every affected repository
        - Avoid duplicate or empty commits when retrying a partially completed Commit stage
        - Verify every created commit
      routes:
        COMMITTED:
          description: All verified delivery changes were committed without including unrelated or sensitive files.

